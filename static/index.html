<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Search Agent</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <h1>AI Search Agent</h1>
            </div>
            <div class="api-key-section">
                <div class="api-key-input-wrapper">
                    <input type="password" id="apiKeyInput" placeholder="Enter Google AI API Key (optional)" autocomplete="off">
                </div>
                <button id="toggleApiKey" class="btn-icon" title="Show/Hide API Key">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <div class="search-container">
                <div class="search-box">
                    <textarea id="queryInput" placeholder="Ask anything... The AI agent will search the web, analyze results, and provide a comprehensive answer." rows="3"></textarea>
                    <button id="searchBtn" class="btn-primary">
                        <span class="btn-text">Search</span>
                        <span class="btn-loading" hidden>
                            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                </div>
            </div>

            <div id="statusSection" class="status-section" hidden>
                <div class="status-timeline" id="statusTimeline"></div>
            </div>

            <div id="resultSection" class="result-section" hidden>
                <div class="result-card">
                    <h2>Answer</h2>
                    <div id="answerContent" class="answer-content"></div>
                </div>
                <div class="result-card" id="sourcesCard" hidden>
                    <h2>Sources</h2>
                    <div id="sourcesList" class="sources-list"></div>
                </div>
                <div class="result-card" id="reasoningCard" hidden>
                    <h2>
                        <button class="collapse-btn" id="reasoningToggle">
                            Reasoning Steps
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                    </h2>
                    <div id="reasoningContent" class="reasoning-content"></div>
                </div>
            </div>

            <div id="errorSection" class="error-section" hidden>
                <div class="error-card">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <p id="errorMessage"></p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Powered by Google Gemini + LlamaIndex + LangGraph + Cross-Encoder</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
